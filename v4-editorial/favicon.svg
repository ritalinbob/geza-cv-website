  <!-- 'gh' Monogram Typography with warm buff halo -->
  <text x="40" y="44" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f7e0c1" stroke="#f7e0c1" stroke-width="5" stroke-linejoin="round" text-anchor="middle" letter-spacing="-0.5">gh</text>
  <text x="40" y="44" font-family="'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="middle" letter-spacing="-0.5">gh</text>
</svg>
