<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <!-- Brutalist Hard Shadow -->
  <rect x="8" y="8" width="68" height="68" rx="10" fill="#1a1a1a"/>
  <!-- Editorial Warm Buff Presentation Box -->
  <rect x="4" y="4" width="68" height="68" rx="10" fill="#f7e0c1" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Secondary thin wireframe lines (Josef Albers Structural Constellation) -->
  <g stroke="#1a1a1a" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="12.66" y1="17.84" x2="34.34" y2="29.93"/>
    <line x1="67.34" y1="18.67" x2="34.34" y2="29.93"/>
