    <line x1="7.0" y1="44.93" x2="28.68" y2="56.6"/>
    <line x1="73.0" y1="34.93" x2="51.18" y2="23.67"/>
    <line x1="51.18" y1="23.67" x2="45.38" y2="50.21"/>
    <line x1="45.38" y1="50.21" x2="67.2" y2="62.44"/>
    <line x1="67.34" y1="18.67" x2="61.54" y2="45.63"/>
    <line x1="64.3" y1="32.57" x2="67.34" y2="18.67"/>
  </g>
  <!-- Primary thick lines (main paradoxical constellation) -->
  <g stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="12.66" y1="17.84" x2="45.8" y2="7.0"/>
    <line x1="45.8" y1="7.0" x2="67.34" y2="18.67"/>
    <line x1="12.66" y1="17.84" x2="7.0" y2="44.93"/>
    <line x1="45.8" y1="7.0" x2="39.86" y2="34.51"/>
    <line x1="18.32" y1="34.23" x2="39.86" y2="34.51"/>
    <line x1="18.32" y1="34.23" x2="39.72" y2="45.63"/>
    <line x1="39.86" y1="34.51" x2="61.54" y2="45.63"/>
    <line x1="39.72" y1="45.63" x2="61.54" y2="45.63"/>
    <line x1="61.54" y1="45.63" x2="64.3" y2="32.57"/>
    <line x1="18.32" y1="34.23" x2="12.25" y2="61.88"/>
    <line x1="12.25" y1="61.88" x2="33.92" y2="73.0"/>
